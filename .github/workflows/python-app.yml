# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        retry() {
          local attempts=$1
          shift
          local n=1
          until "$@"; do
            if [ $n -ge $attempts ]; then
              echo "Command failed after $n attempts."
              return 1
            fi
            n=$((n+1))
            echo "Command failed. Retrying attempt $n/$attempts in 5 seconds..."
            sleep 5
          done
        }
        retry 3 python -m pip install --upgrade pip
        retry 3 pip install flake8 pytest
        if [ -f requirements.txt ]; then retry 3 pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        retry() {
          local attempts=$1
          shift
          local n=1
          until "$@"; do
            if [ $n -ge $attempts ]; then
              echo "Command failed after $n attempts."
              return 1
            fi
            n=$((n+1))
            echo "Command failed. Retrying attempt $n/$attempts in 5 seconds..."
            sleep 5
          done
        }
        # stop the build if there are Python syntax errors or undefined names
        retry 3 flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        retry 3 flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        retry() {
          local attempts=$1
          shift
          local n=1
          until "$@"; do
            if [ $n -ge $attempts ]; then
              echo "Command failed after $n attempts."
              return 1
            fi
            n=$((n+1))
            echo "Command failed. Retrying attempt $n/$attempts in 5 seconds..."
            sleep 5
          done
        }
        retry 3 pytest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Starting deployment..."
          # Replace this echo with actual deployment commands, for example:
          # ssh user@your-server "cd /path/to/project && git pull && systemctl restart your-service"
